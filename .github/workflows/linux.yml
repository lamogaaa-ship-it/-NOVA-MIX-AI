name: Linux build

# Builds the Linux VST3 + Standalone, runs the full test suite (including hosting a real
# VST3), the host check and pluginval at strictness 10 under a virtual display.

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_DIR: build-linux
  PLUGINVAL_VERSION: v1.0.4

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb ccache \
            libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libxi-dev libglu1-mesa-dev libegl-dev ladspa-sdk

      - name: Cache dependencies (JUCE, Catch2)
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}/_deps/*-src
          key: deps-linux-${{ hashFiles('cmake/NovaDependencies.cmake') }}

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release -DNOVA_BUILD_TESTS=ON -DNOVA_BUILD_TOOLS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Tests
        run: xvfb-run -a "$BUILD_DIR/plugin/tests/NovaTests" --reporter console --reporter "JUnit::out=$BUILD_DIR/test-results.xml"

      - name: Host check
        run: |
          HC="$(find "$BUILD_DIR/plugin/tools" -type f -name nova-host-check -perm -u+x | head -n 1)"
          xvfb-run -a "$HC" "$BUILD_DIR/plugin/NovaMixAI_artefacts/Release/VST3/NOVA MIX AI.vst3"

      - name: Plug-in scanner (real scan, schema, crash blocklist)
        run: |
          python3 -m venv /tmp/pyv && /tmp/pyv/bin/pip install -q jsonschema
          SC="$(find "$BUILD_DIR/plugin/tools" -type f -name nova-plugin-scanner -perm -u+x | head -n 1)"
          xvfb-run -a scripts/ci/scanner_check.sh "$SC" "$BUILD_DIR/plugin/NovaMixAI_artefacts/Release/VST3/NOVA MIX AI.vst3" /tmp/pyv/bin/python

      - name: pluginval (strictness 10)
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --timeout-ms 600000 \
            --output-dir pluginval-logs --validate "$BUILD_DIR/plugin/NovaMixAI_artefacts/Release/VST3/NOVA MIX AI.vst3"

      - name: Upload Linux VST3
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-MIX-AI-linux-vst3
          path: ${{ env.BUILD_DIR }}/plugin/NovaMixAI_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-MIX-AI-linux-reports
          path: |
            ${{ env.BUILD_DIR }}/test-results.xml
            pluginval-logs/
          if-no-files-found: ignore
