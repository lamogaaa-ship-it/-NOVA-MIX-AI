name: Companion + backend

on:
  push:
    branches: ["**"]
    paths: ["companion/**", "backend/**", "shared/schemas/**", ".github/workflows/python.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        project: [companion, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: ${{ matrix.project }}
        run: pip install -r requirements-dev.txt
      - name: Test
        working-directory: ${{ matrix.project }}
        run: python -m pytest -q
