name: Companion + backend

on:
  push:
    branches: ["**"]
    paths: ["companion/**", "backend/**", "shared/schemas/**", ".github/workflows/python.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        project: [companion, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: ${{ matrix.project }}
        run: pip install -r requirements-dev.txt
      - name: Test
        working-directory: ${{ matrix.project }}
        run: python -m pytest -q

  real-speech:
    # The companion's real speech-to-text (faster-whisper) on synthesised English and Arabic speech.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng
          pip install -r companion/requirements-dev.txt faster-whisper
      - name: Real STT test
        working-directory: companion
        env:
          NOVA_REAL_STT: "1"
          NOVA_STT_MODEL: base
        run: python -m pytest -q -s tests/test_real_stt.py

  backend-image:
    # Validates that the NOVA Cloud container builds and starts (not published anywhere).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nova-backend:ci backend
      - name: Start and probe /v1/health
        run: |
          docker run -d --name nova -p 8080:8080 -e NOVA_CLIENT_TOKEN_SHA256=0000 nova-backend:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/v1/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/v1/health | grep -q '"ok":true'
          docker logs nova
