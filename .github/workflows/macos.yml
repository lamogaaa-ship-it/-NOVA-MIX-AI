name: macOS build

# Universal (arm64 + x86_64) VST3, Audio Unit and Standalone app, unit tests, pluginval,
# auval, ad-hoc code signing, .pkg installer and .dmg. Everything is uploaded as artifacts.

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false   # a new push waits: every run's artifacts stay complete

env:
  BUILD_DIR: build-macos
  PLUGINVAL_VERSION: v1.0.4

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install ninja ccache || true
          cmake --version
          xcodebuild -version
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-

      - name: Cache dependencies (JUCE, Catch2)
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}/_deps/*-src
          key: deps-macos-${{ hashFiles('cmake/NovaDependencies.cmake') }}

      - name: Configure (Release, universal)
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DNOVA_BUILD_TESTS=ON -DNOVA_BUILD_TOOLS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          ccache --max-size=2G || true
          cmake --build "$BUILD_DIR" --parallel
          ccache --show-stats || true

      - name: Check architectures
        run: |
          ART="$BUILD_DIR/plugin/NovaMixAI_artefacts/Release"
          for f in "$ART/VST3/NOVA MIX AI.vst3/Contents/MacOS/NOVA MIX AI" \
                   "$ART/AU/NOVA MIX AI.component/Contents/MacOS/NOVA MIX AI" \
                   "$ART/Standalone/NOVA MIX AI.app/Contents/MacOS/NOVA MIX AI"; do
            echo "$f: $(lipo -archs "$f")"
            lipo -archs "$f" | grep -q arm64
            lipo -archs "$f" | grep -q x86_64
          done

      - name: Unit and integration tests
        run: |
          "$BUILD_DIR/plugin/tests/NovaTests" --reporter console --reporter "JUnit::out=$BUILD_DIR/test-results.xml"

      - name: Host check (load the VST3 like a DAW)
        run: |
          HC="$(find "$BUILD_DIR/plugin/tools" -type f -name nova-host-check -perm -u+x | head -n 1)"
          "$HC" "$BUILD_DIR/plugin/NovaMixAI_artefacts/Release/VST3/NOVA MIX AI.vst3"

      - name: Plug-in scanner (real scan, schema, crash blocklist)
        run: |
          python3 -m venv /tmp/pyv && /tmp/pyv/bin/pip install -q jsonschema
          SC="$(find "$BUILD_DIR/plugin/tools" -type f -name nova-plugin-scanner -perm -u+x | head -n 1)"
          scripts/ci/scanner_check.sh "$SC" "$BUILD_DIR/plugin/NovaMixAI_artefacts/Release/VST3/NOVA MIX AI.vst3" /tmp/pyv/bin/python

      - name: Package (.pkg, .dmg, zips)
        run: scripts/macos/package.sh "$BUILD_DIR" dist

      - name: pluginval (VST3, strictness 10)
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 \
            --timeout-ms 600000 --output-dir pluginval-logs \
            --validate "dist/stage/vst3/NOVA MIX AI.vst3"

      - name: Install AU and run auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "dist/stage/au/NOVA MIX AI.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -a | grep -i nvax || true
          auval -strict -v aufx Nmix Nvax

      - name: pluginval (AU, strictness 10)
        run: |
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 \
            --timeout-ms 600000 --output-dir pluginval-logs \
            --validate ~/Library/Audio/Plug-Ins/Components/"NOVA MIX AI.component"

      - name: Upload installer (.pkg + .dmg)
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-MIX-AI-macOS-installer
          path: |
            dist/*.pkg
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload plug-in bundles (VST3, AU, Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-MIX-AI-macOS-bundles
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload test and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-MIX-AI-macOS-reports
          path: |
            ${{ env.BUILD_DIR }}/test-results.xml
            pluginval-logs/
          if-no-files-found: ignore

  companion:
    # Voice companion as a self-contained app (independent of the plug-in job).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build NOVA Companion.app + installer
        run: scripts/macos/build_companion.sh dist-companion
      - name: Upload companion
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Companion-macOS
          path: dist-companion/*
          if-no-files-found: error

  complete:
    # One disk image with the plug-in installer and the voice companion installer.
    needs: [macos, companion]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NOVA-MIX-AI-macOS-installer
          path: in/plugin
      - uses: actions/download-artifact@v4
        with:
          name: NOVA-Companion-macOS
          path: in/companion
      - name: Build the complete disk image
        run: |
          VERSION="$(sed -n 's/^project(NOVA_MIX_AI VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          mkdir -p root out
          cp in/plugin/*.pkg "root/1 - Install NOVA MIX AI.pkg"
          cp in/companion/*.pkg "root/2 - Install NOVA Companion (voice, optional).pkg"
          cp scripts/macos/resources/README.txt "root/READ ME FIRST.txt"
          cp scripts/macos/resources/README-ar.txt "root/اقرأني أولاً.txt"
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "NOVA MIX AI $VERSION" -srcfolder root -ov -format UDZO "out/NOVA-MIX-AI-$VERSION-macOS-complete.dmg" && break
            [ $attempt = 5 ] && exit 1; sleep $((attempt * 5))
          done
          hdiutil verify "out/NOVA-MIX-AI-$VERSION-macOS-complete.dmg"
          (cd out && shasum -a 256 *.dmg | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-MIX-AI-macOS-complete
          path: out/*
          if-no-files-found: error
